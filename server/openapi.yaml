openapi: 3.1.0
info:
  title: Homelab Companion API
  version: "1"
  summary: What the Homelab iOS app reads from a homelab server.
  description: |
    A small, read-mostly JSON API. Any server can implement it: the owner's homelab agent (agent-chat) does, and
    `server/reference_server.py` in this repo is a complete stdlib implementation for any other homelab.

    Rules for servers:
    - All paths are under `/api/v1/`. JSON in and out (`application/json; charset=utf-8`), UTF-8.
    - Auth is one of: a reverse proxy that adds an identity header (for example `tailscale serve` adds
      `Tailscale-User-Login`; the app sends no token then), or `Authorization: Bearer <token>`.
      Answer 401 or 403 for a missing or wrong identity.
    - Every field except the ones marked `required` is optional. Clients ignore unknown fields and unknown enum
      values, so servers may add fields at any time. Breaking changes need `/api/v2/`.
    - Times are ISO 8601. Without a time zone they mean the server's local time; the app reads them in the
      phone's time zone (the same in a homelab). Send a zone if they can differ.
    - `features` in `/info` tells the app which tabs to show. A server without `chat` simply leaves it out.

    Rules for the client (the app):
    - Never sends an `Origin` header and never sends cookies.
    - Treats every text from the server as untrusted plain text (Markdown is rendered inline only, no HTML,
      links only http/https).
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: homelab.example.ts.net
security:
  - identityHeader: []
  - bearer: []
paths:
  /info:
    get:
      summary: Server name, API version and features. The app's "Test connection" calls this.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /state:
    get:
      summary: Everything the overview, the actions tab and the widgets show, in one call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /messages:
    get:
      summary: Chat history after a message id (the newest 200 at most).
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "404": { description: The server has no chat (feature `chat` missing). }
    post:
      summary: Send a chat message or a slash command. The answer arrives later in GET /messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer, format: int64, description: The id of the stored message. }
        "400": { description: Empty or longer than 4000 characters. }
        "415": { description: Not JSON. }
        "429": { description: Too many runs; try later. }
  /button:
    post:
      summary: Press a signed action button from `State.pending[].buttons`.
      description: The server waits up to ~2 minutes for the result and returns it as text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, example: HOMELAB_APPROVE_ab12_0123456789abcdef }
      responses:
        "200":
          description: Done (or still running; the text says so).
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
        "403": { description: Unknown, forged or expired button. }
  /services:
    get:
      summary: Web UIs of the homelab, for the launcher.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
  /actions:
    get:
      summary: Actions the app may start itself, with what their forms need (feature `run-actions`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: "#/components/schemas/ActionSpec" }
  /actions/{name}:
    post:
      summary: Start an action now (feature `run-actions`).
      description: |
        The owner started it and confirmed it in the app, so it runs at once, not as a proposal. The server checks
        everything again: the action must be on its list, `arg` must fit one of the action's `arg` variants, and
        `payload` may only hold the action's fields (text, within `max`, required ones present). It waits up to
        ~100 s for the result; a slower action answers `running: true` and reports in the chat.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arg: { type: string, description: "The built argument (see ArgVariant). Empty or missing: none.", example: "2026-11-07T07:30" }
                payload:
                  type: object
                  additionalProperties: { type: string }
                  example: { summary: Milk, list: shopping }
      responses:
        "200":
          description: It ran (or still runs). `ok` false = it ran and failed; `text` is its output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: "Argument or payload refused; `error` says why." }
        "404": { description: Not an action the app may start. }
        "429": { description: Too many actions from the app in the last hour. }
        "5XX": { description: "The server failed. Its `error` text, if any, is shown as the reason, so say there whether anything ran. Without it the app says it is not sure the action ran." }
  /documents:
    post:
      summary: Send a PDF to the document inbox, for example Paperless (feature `documents`).
      description: |
        The raw PDF is the body (`Content-Type: application/pdf`, nothing else; a JSON or form body gets 415, which also
        keeps browsers out: a cross-site request with that type needs a preflight the server never answers). The id makes
        a retry harmless: a repeat of the same `X-Homelab-Id` gets the first answer and files nothing twice.
        The server streams the body to a spool folder, answers 202 and files the PDF in the background. It never gives
        the file or its text to a language model.
      parameters:
        - name: X-Homelab-Id
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f-]{36}$" }
          description: A UUID the client makes for this item (lower case).
        - name: X-Homelab-Title
          in: header
          required: false
          schema: { type: string }
          description: Percent-encoded UTF-8, at most 128 characters after decoding; control characters are dropped.
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Accepted. The result of filing it comes later (the chat).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareReply" }
        "400": { description: "Not a PDF (the body must start with `%PDF-`), or a bad id." }
        "409": { description: The same id is still being handled. Try again later. }
        "411": { description: No `Content-Length`. }
        "413": { description: "Larger than the server's limit (25 MB)." }
        "415": { description: Not `application/pdf`. }
        "429": { description: More than 20 uploads in the last hour, or the spool is full. }
  /search:
    get:
      summary: Search the server's media library or other sources (feature `search`).
      description: |
        The answer is cards, drawn like any card; the media search answers one `poster-grid` card whose items have an
        `image` and, where a request makes sense, an `action`. No cards, or cards without items, mean nothing was found.
        `q` is 2 to 100 characters after trimming; the app sends it whitespace-normalised.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: The query as understood and the cards that answer it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  cards:
                    type: array
                    items: { $ref: "#/components/schemas/Card" }
        "400": { description: "`q` too short, too long or with control characters; `error` says why." }
        "429": { description: Too many searches. }
        "502": { description: "The source did not answer; `error` has the words the app shows (\"Seerr did not answer\")." }
  /poster/{size}/{file}:
    get:
      summary: A picture an item's `image` names (the path is up to the server; this is the reference one).
      description: |
        The app loads item `image`s with the same login as the API, accepts at most 1 MB, and only JPEG, PNG or WebP.
        A path on the server or an absolute URL on the same scheme, host and port; nothing else is ever loaded.
      parameters:
        - { name: size, in: path, required: true, schema: { type: string, enum: [w154, w342] } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9]{10,40}\\.(jpg|png)$" } }
      responses:
        "200":
          description: The picture.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: Not a picture this server issued. }
  /share:
    post:
      summary: Send a web link (feature `share`).
      description: |
        The server decides what to do with the link; it never trusts the client's guess and never fetches the link.
        A willhaben ad (`willhaben.at/iad/...-<digits>` or `adId=`) starts a price check (route `willhaben`); any
        other http(s) link is stored on a read-later list (route `read-later`). Anything else (other schemes, a user
        name or password in the link, over 2048 characters) is refused with 400. A repeat of the same `id` gets the
        first answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind, url]
              properties:
                id: { type: string, pattern: "^[0-9a-f-]{36}$" }
                kind: { type: string, enum: [url] }
                url: { type: string, maxLength: 2048 }
                title: { type: string, maxLength: 200, description: The page title from the share sheet. }
      responses:
        "200":
          description: Taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareReply" }
        "400": { description: "Refused; `error` says why." }
        "429": { description: More than 30 shares in the last hour. }
components:
  securitySchemes:
    identityHeader:
      type: apiKey
      in: header
      name: Tailscale-User-Login
      description: Added by the reverse proxy (tailscale serve), never by the app.
    bearer:
      type: http
      scheme: bearer
  responses:
    Unauthorized: { description: No identity. }
    Forbidden: { description: Identity not allowed. }
  schemas:
    Info:
      type: object
      required: [api]
      properties:
        api: { type: integer, const: 1 }
        name: { type: string, example: homelab, description: Shown as the server's title. }
        server: { type: string, example: homelab-agent }
        version: { type: string, example: "2026-11-04" }
        features:
          type: array
          items:
            type: string
            enum: [status, hosts, actions, run-actions, chat, cards, services, documents, share, search]
          description: |
            `actions`: proposed actions to approve (`pending`, `/button`). `run-actions`: the app may start actions
            itself (`/actions`). `documents`: `POST /documents` takes a PDF (the Scan tile, the share extension).
            `share`: `POST /share` takes a link. `search`: `GET /search?q=` answers cards (the Find a movie or show
            screen). The other values switch the matching tabs and sections.
        auth: { type: string, enum: [identity, token, none] }
        commands:
          type: array
          items: { type: string, pattern: "^/\\S{1,23}$" }
          description: Slash commands the chat understands. The app shows them as quick buttons (at most 8).
        standing_approvals:
          type: boolean
          description: The server remembers an "always" approval and runs that action by itself later.
    State:
      type: object
      properties:
        time: { type: string, format: date-time, description: When the server built this answer. }
        status: { $ref: "#/components/schemas/Status" }
        checked: { type: string, format: date-time, description: When the health data was collected. }
        problems:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        pending:
          type: array
          items: { $ref: "#/components/schemas/PendingAction" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        busy:
          type: array
          items: { type: string }
          description: Jobs running right now (the chat shows "working…").
        last_message: { $ref: "#/components/schemas/Message" }
        commute: { $ref: "#/components/schemas/Commute" }
    Commute:
      type: object
      required: [date]
      description: |
        The way to school today (optional, additive). The app uses it only when `date` is today. It drives the
        "Leave by" Live Activity. Times are ISO 8601 with a zone. Bike day: `mode: bike`, `ride` and `leave_by`,
        no `train`/`next`. Error: `{date, error}`. Not active: `{date, active: false, why}`.
      properties:
        date: { type: string, format: date, example: "2026-11-07" }
        mode: { type: string, enum: [u6, bike] }
        line: { type: string, example: U6 }
        first_lesson: { type: string, format: date-time }
        leave_by: { type: string, format: date-time }
        train: { type: string, format: date-time, description: The train to take. }
        next: { type: string, format: date-time, description: The train after it. }
        next_too_late: { type: boolean, description: The next train would be too late for the first lesson. }
        disruptions:
          type: array
          items: { type: string }
          description: "Short titles, e.g. `U6: Schadhaftes Fahrzeug`. The first one shows on the lock screen."
        ride: { type: integer, minimum: 1, description: Bike day, minutes. }
        updated: { type: string, format: date-time }
        error: { type: string }
        active: { type: boolean }
        why: { type: string }
    Status:
      type: string
      enum: [ok, warning, problem, unknown]
    Problem:
      description: An object, or (legacy) a plain string, which clients treat as `{text}`.
      oneOf:
        - type: string
        - type: object
          required: [text]
          properties:
            id: { type: string }
            text: { type: string }
            host: { type: string, description: A Host.id. }
            severity: { type: string, enum: [warning, problem] }
            since: { type: string, format: date-time }
    Host:
      type: object
      required: [id]
      properties:
        id: { type: string, example: nas }
        name: { type: string, example: "NAS (basement)" }
        kind: { type: string, example: raspberry-pi, description: "Free text; the app picks an icon for: server, raspberry-pi, laptop, desktop, nas, vm." }
        reachable: { type: boolean, description: "null/missing = not checked yet." }
        checked: { type: string, format: date-time }
        load: { type: number, description: 1-minute load average. }
        cpu_count: { type: integer, description: Lets the app show load as a share of the cores. }
        mem_pct: { type: integer, minimum: 0, maximum: 100 }
        temp: { type: number, description: °C }
        disks:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: Mount point → percent used.
        containers:
          type: object
          properties:
            up: { type: integer }
            total: { type: integer }
        updates:
          type: object
          properties:
            upgradable: { type: integer }
            reboot_required: { type: boolean }
        backup:
          type: object
          properties:
            last: { type: string, description: Free text or a date-time. }
            result: { type: string, example: success }
        flags:
          type: array
          items: { type: string }
          description: "Known: undervoltage_now, throttled_now, undervoltage_since_boot, asleep. Others are shown as text."
        url: { type: string, format: uri, description: A web UI for this host. }
        history: { $ref: "#/components/schemas/HostHistory" }
        container_list:
          type: array
          items: { $ref: "#/components/schemas/Container" }
          description: >-
            Every container of the host (Lab shows them, problems first). The summary `containers: {up, total}` stays.
    HostHistory:
      type: object
      description: >-
        The last 24 h of a host, for sparklines. One point every `step` seconds, oldest first; the last point of every
        series is at `end`. Each series is optional; null = no data for that slot (host unreachable). At most 288
        points per series (the app keeps the newest). Missing `end`: the host's `checked`.
      properties:
        step: { type: integer, minimum: 1, example: 300, description: Seconds between two points. }
        end: { type: string, format: date-time, example: "2026-11-06T13:40:00", description: "Local time, or with a zone." }
        load:
          type: array
          maxItems: 288
          items: { type: [number, "null"] }
          description: 1-minute load average.
        mem_pct:
          type: array
          maxItems: 288
          items: { type: [number, "null"], minimum: 0, maximum: 100 }
        temp:
          type: array
          maxItems: 288
          items: { type: [number, "null"] }
          description: °C
        disk_pct:
          type: array
          maxItems: 288
          items: { type: [number, "null"], minimum: 0, maximum: 100 }
          description: Percent used of the fullest disk.
    Container:
      type: object
      required: [name]
      properties:
        name: { type: string, example: sonarr }
        state:
          type: string
          enum: [running, exited, restarting, paused, created, removing, dead]
          description: Docker's state. Unknown values are shown as unknown.
        health:
          type: [string, "null"]
          enum: [healthy, unhealthy, starting, null]
          description: null = no health check.
        restarts: { type: integer, minimum: 0, description: Docker's RestartCount. }
        restartable:
          type: boolean
          description: >-
            On the host's restart list: the action `restart-container` with the argument `<host-id>:<name>` would be
            accepted. The app offers Restart only when `/actions` also lists `restart-container`.
    PendingAction:
      type: object
      required: [id]
      properties:
        id: { type: string, example: ab12 }
        job: { type: string, example: watchdog }
        action: { type: string, example: restart }
        arg: { type: string, example: "media sonarr" }
        reason: { type: string }
        created: { type: string, format: date-time }
        buttons:
          type: object
          description: Signed strings for POST /button. A missing verb means the server doesn't offer it.
          properties:
            approve: { type: string }
            always: { type: string }
            deny: { type: string }
    Card:
      type: object
      required: [id]
      description: A generic box on the overview, so each homelab can show its own data (media, school, weather…).
      properties:
        id: { type: string }
        date:
          type: string
          example: "2026-11-07"
          description: The day the card is about, a plain day. On the `today` card the app switches to its tomorrow mode
            (header "Tomorrow", countdown to the first stop) when this is the day after the phone's today. Not a plain
            day = ignored.
        title: { type: string }
        subtitle: { type: string }
        icon: { type: string, description: An SF Symbol name, e.g. play.tv. Unknown names fall back to a square. }
        tint: { type: string, enum: [gray, blue, green, orange, red, purple, teal, yellow, pink] }
        place:
          type: string
          enum: [today, lab]
          default: today
          description: "Where the card shows. `lab`: in Lab between Hosts and Services, as rows. Unknown or missing
            means Today."
        style:
          type: string
          enum: [list, metrics, text, checklist, countdown, departures, poster-grid]
          default: list
          description: |
            `poster-grid`: the items as posters (`image`, 2:3) in 2-3 columns with title, subtitle, value and the item's
            `action` as a button. Older apps show it as `list`.
            `checklist`: to-dos, a circle per item (filled when `done`), with `due` as a short day/time.
            `countdown`: each item counts down to its `due` ("2 d", "5 h", "today", "3 d ago"); the app sorts by `due`.
            `departures`: public transport. Each item is one departure: `title` the direction, `subtitle` the stop
            (with ` · +3 min` when late and ` · planned` when there is no real-time data), `value` the clock text,
            `due` the time with a zone, `tint: orange` when late. Items of one direction and stop are grouped in the
            order you send them (the relevant direction first). `text` holds the disruption titles (and `tint: red`).
            Older apps show `checklist`, `countdown` and `departures` as `list`.
        updated: { type: string, description: Free text or a date-time. }
        text: { type: string, description: For style text. Inline Markdown. }
        action:
          $ref: "#/components/schemas/ItemAction"
          description: A button in the card's header that opens this action's form, prefilled with `arg` and `payload`
            (e.g. "Add" on a to-do list). Hidden unless `GET /actions` lists the action.
        items:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              subtitle: { type: string }
              value: { type: string }
              progress: { type: number, minimum: 0, maximum: 1 }
              icon: { type: string }
              url: { type: string, format: uri }
              tint: { type: string }
              image:
                type: string
                maxLength: 512
                description: A picture of this server, a path (`/api/v1/poster/w342/ab12.jpg`) or an absolute URL with
                  the server's own scheme, host and port. The app loads nothing else, with the API's login, at most
                  1 MB, JPEG, PNG or WebP. Used by `poster-grid`.
              done: { type: boolean, description: Checklist items. Ticked off or not. }
              cancelled: { type: boolean, description: A lesson that falls out. Drawn struck through and grey. }
              due:
                type: string
                description: A day (`2026-11-07`) or a time (`2026-11-07T18:00`, local without a zone). Countdown items
                  count to it; checklist items show it.
                example: "2026-11-07T18:00"
              action:
                $ref: "#/components/schemas/ItemAction"
                description: One tap runs this action after a confirm (`label` is the confirm text), then the app
                  refreshes. On a checklist the item's circle does it (tick off). Hidden unless `GET /actions` lists
                  the action.
    ShareReply:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        id: { type: string, description: The client's id, echoed. }
        route: { type: string, enum: [willhaben, read-later], description: "`/share` only." }
        text: { type: string, example: Sent to Paperless. The result will be in the chat. }
    ItemAction:
      type: object
      required: [name]
      description: An action from `GET /actions` (feature `run-actions`) with its argument and payload filled in. The app
        sends it as `POST /actions/<name>` with `{arg, payload}`; the server checks it like any other start.
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: todo-done }
        label: { type: string, example: Tick off, description: Button or confirm text. Default the action's own label. }
        arg: { type: string, default: "", description: Must fit one of the action's `arg` variants, or be empty. }
        payload:
          type: object
          additionalProperties: { type: string }
          description: Field values. Fields the action doesn't have are dropped; other values than strings too.
          example: { item: Milk, list: shopping }
    Message:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: Increasing; used as the cursor for `after`. }
        ts: { type: string, format: date-time }
        from: { type: string, enum: [me, agent] }
        job: { type: string, description: "Empty or chat = a conversation reply; other = a scheduled report (morning, watchdog…)." }
        status: { type: string, description: "OK, WARN, ALERT, ERROR or empty." }
        text: { type: string }
        pending:
          type: array
          items: { $ref: "#/components/schemas/PendingAction" }
          description: Proposals made in this message that are still waiting, the same objects (and signed buttons) as
            in `State.pending`. Computed when the server answers; approved, denied or expired ones are left out. The
            app shows Approve / Always / Deny in the bubble.
        cards:
          type: array
          items: { $ref: "#/components/schemas/Card" }
          description: Cards shown compactly inside the bubble, under the text. Any style.
    MessagePage:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        busy:
          type: array
          items: { type: string }
    ActionSpec:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: wake-set }
        label: { type: string, example: Wake-up }
        icon: { type: string, description: SF Symbol name. }
        hint: { type: string, description: One line under the form. }
        destructive: { type: boolean, description: The app asks with a red button. }
        start: { type: boolean, default: true, description: "false = no Start tile; the action is only used through card/item actions (todo-done, parcel-done)." }
        arg:
          type: array
          description: Ways to build the argument; the form offers a picker when there are several. Missing = none.
          items: { $ref: "#/components/schemas/ArgVariant" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ActionField" }
    ArgVariant:
      type: object
      required: [parts]
      description: The argument is the parts' values joined, e.g. date + "T" + time = "2026-11-07T07:30".
      properties:
        label: { type: string, example: Wake me }
        parts:
          type: array
          items: { $ref: "#/components/schemas/ArgPart" }
    ArgPart:
      type: object
      required: [kind]
      description: A variant with a part the app doesn't know is dropped (it couldn't build the argument).
      properties:
        kind: { type: string, enum: [literal, date, time, number, word, choice], description: "date 2026-11-07, time 07:30, word [A-Za-z0-9][A-Za-z0-9._-]{0,63} (no leading . _ -)" }
        label: { type: string, example: Day }
        text: { type: string, description: "literal only: the fixed text, e.g. T or :off" }
        options:
          type: array
          items: { $ref: "#/components/schemas/ActionOption" }
    ActionField:
      type: object
      required: [name]
      properties:
        name: { type: string }
        label: { type: string }
        kind:
          type: string
          enum: [text, multiline, date, datetime, date-or-datetime, number, choice]
          description: "Unknown = text. Values are always text: date 2026-11-07, datetime 2026-11-07T08:00 (local time)."
        max: { type: integer, description: Maximum length. }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/ActionOption" }
        placeholder: { type: string }
        hidden: { type: boolean, default: false, description: "Never shown and never asked for. The app sends it only when a card/item action prefilled it (a to-do's uid); a Start tile sends no hidden field." }
        hidden_when:
          type: object
          description: "Other field name -> values of it. While that field holds one of them the app hides this field and doesn't send it (Due on the shopping list). Unknown names and non-list values are ignored."
          additionalProperties:
            type: array
            items: { type: string }
          example: { list: [shopping] }
    ActionOption:
      type: object
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
    ActionResult:
      type: object
      properties:
        ok: { type: boolean }
        text: { type: string }
        running: { type: boolean, description: Still running; the result comes in the chat. }
    Service:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        group: { type: string }
        icon: { type: string, description: SF Symbol name. }
        description: { type: string }
