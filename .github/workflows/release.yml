# Release: push a tag like v1.0.0 -> GitHub Release with the IPA + SHA-256, and a SideStore/AltStore source on
# GitHub Pages (https://qantrex.github.io/homelab-ios/source.json). Free standard runner only (macos-26).
# One-time setup by the owner: Settings -> Pages -> Source: GitHub Actions. See docs/CI.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0"
        required: true

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write   # create the release and upload its files (only the `gh` steps get the token)
      pages: read       # configure-pages: is Pages enabled?
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Without Pages (Settings → Pages → Source: GitHub Actions) the GitHub Release is still published;
      # only the SideStore source page is skipped, and the job summary says so.
      - name: Check GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Version from tag
        run: |
          version=${TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA_NAME=Homelab-$version.ipa" >> "$GITHUB_ENV"

      - name: Toolchain and xtool
        run: |
          sw_vers; xcodebuild -version; swift --version
          # Pinned and checksummed: a release never builds with an unreviewed xtool (no brew fallback here).
          dir=$RUNNER_TEMP/xtool
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/xtool.app.zip" \
            "https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip"
          echo "a56e98d69dea02a97a17e609f0ae8771c57ffaab23f1d62513fd9ada222026b3  $dir/xtool.app.zip" | shasum -a 256 -c -
          ditto -x -k "$dir/xtool.app.zip" "$dir"
          echo "$dir/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          "$dir/xtool.app/Contents/Resources/bin/xtool" --version || true

      - name: Shared code tests
        run: KIT_ONLY=1 swift test

      - name: Build release IPA
        run: |
          scripts/build-ipa 2>&1 | tee build-device.log
          ipa=$(find xtool -name '*.ipa' | head -1)
          mkdir -p dist && cp "$ipa" "dist/$IPA_NAME"
          (cd dist && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256" && cat "$IPA_NAME.sha256")

      - name: Verify IPA
        run: scripts/verify-ipa "dist/$IPA_NAME"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}   # only the steps that call gh get the token
          GH_REPO: ${{ github.repository }}
        run: |
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$IPA_NAME" "dist/$IPA_NAME.sha256" --clobber
          else
            gh release create "$TAG" "dist/$IPA_NAME" "dist/$IPA_NAME.sha256" \
              --title "Homelab $VERSION" --generate-notes --verify-tag "${pre[@]+"${pre[@]}"}"
          fi

      - name: Build site (source.json, icon, index.html)
        env:
          GH_TOKEN: ${{ github.token }}   # reads the release notes
          GH_REPO: ${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p site
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$IPA_NAME"
          prev=()
          if curl -fsSL --max-time 20 "$SITE_URL/source.json" -o previous-source.json; then
            prev=(--previous previous-source.json)
          else
            echo "no live source.json yet, starting a new one"
          fi
          notes=$(gh release view "$TAG" --json body -q .body 2>/dev/null | head -c 4000 || true)
          scripts/make-source --version "$VERSION" --ipa "dist/$IPA_NAME" --download-url "$download" \
            --notes "${notes:-Homelab $VERSION}" "${prev[@]+"${prev[@]}"}" --output site/source.json
          if [ -f Resources/AppIcon.png ]; then cp Resources/AppIcon.png site/icon.png
          else echo "::warning::Resources/AppIcon.png missing, the source has no icon"; fi

          source_url="$SITE_URL/source.json"
          enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$source_url")
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Homelab iOS</title>
          <style>
            :root { color-scheme: light dark; }
            body { font: 17px/1.5 -apple-system, system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 16px; }
            img { width: 96px; height: 96px; border-radius: 22px; }
            a.button { display: inline-block; padding: .7rem 1.2rem; border-radius: .7rem; background: #2F6FED; color: #fff; text-decoration: none; margin: .3rem 0; }
            code { word-break: break-all; }
          </style>
          </head>
          <body>
          <img src="icon.png" alt="">
          <h1>Homelab iOS</h1>
          <p>Latest version: <strong>$VERSION</strong></p>
          <p><a class="button" href="sidestore://source?url=$enc">Add to SideStore</a><br>
             <a class="button" href="altstore://source?url=$enc">Add to AltStore</a></p>
          <p>Or add this source by hand: <code>$source_url</code></p>
          <p><a href="$download">Download the IPA</a> ·
             <a href="https://github.com/${GITHUB_REPOSITORY}">Source code</a></p>
          </body>
          </html>
          HTML
          python3 -m json.tool site/source.json > /dev/null
          ls -la site

      - name: Attach source.json to the release (works without Pages)
        env:
          GH_TOKEN: ${{ github.token }}   # only the steps that call gh get the token
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" site/source.json --clobber

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - name: Note when Pages is off
        if: steps.pages.outcome != 'success'
        run: |
          echo "### GitHub Pages is not enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "The release and IPA are published. To publish the SideStore source, enable Pages (Settings → Pages → Source: GitHub Actions) and re-run this workflow with the tag." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy the source to Pages
      id-token: write   # required by actions/deploy-pages
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
