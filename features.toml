name = "GitHub Pages (classic Jekyll build)"
kind = "ci"
version = "Jekyll 3.10.0, kramdown 2.4.0 with GFM input, Liquid 4.0.4, jekyll-relative-links 0.6.1 (as of 2026-11-07)"
why = "Builds and hosts the docs site from main /docs on every push, without a workflow of ours. GitHub sets the versions; Liquid on every page and kramdown instead of GitHub's renderer are why docs/CI.md#docs-site has two rules."
url = "https://pages.github.com/versions/"

[[dependency]]
id = "gha-runners"
name = "GitHub-hosted runners"
kind = "ci"
version = "ubuntu-latest (job runs in the pinned Swift container), macos-26, xcode-27"
why = "Free standard runners only (public repo); both macOS runners are required."
pins = [".github/workflows/ci.yml: runs-on: ubuntu-latest", ".github/workflows/ci.yml: runner: [macos-26, xcode-27]"]
