[[feature]]
id = "homepage-import"
name = "Import from Homepage"
area = "Server"
status = "partial"
since = "2026-11-07"
summary = "A `homepage` key in the Homelab Bridge's config reads Homepage's services.yaml at start: every service with an http(s) href becomes a launcher entry (name, url, innermost group, an SF Symbol for well-known icon names, description); `uptimekuma`, `gatus`, `proxmox`, `pihole` (v6 only; a v5 widget is logged as not supported), `adguard`, `sonarr`, `radarr`, `qbittorrent` and `minecraft` (a `gameserver` source) widgets become sources of those types, never with actions (more keys per source, a pause too, by hand with `extra`); other widgets are logged as not yet supported. Keys are taken only as the names of their HOMEPAGE_VAR_/HOMEPAGE_FILE_ placeholders; a key written in services.yaml for an imported widget stops the start with a message that never prints it. Needs PyYAML (in the Docker image); without it the start says so."
server_features = ["services", "status", "cards"]
endpoints = ["GET /services", "GET /state"]
api_fields = ["services", "state.problems", "state.cards"]
sources = ["server/sources/_homepage.py#convert", "server/reference_server.py#Config", "server/test_homepage_import.py",
           "server/examples/homepage-services.yaml", "server/examples/sources-homepage.json"]
tests = ["server/test_homepage_import.py::HomepageNormal", "server/test_homepage_import.py::HomepageOdd",
         "server/test_homepage_import.py::HomepageLiteralKeys", "server/test_homepage_import.py::HomepageConfig",
         "server/test_homepage_import.py::PyYAMLMissing", "server/test_homepage_import.py::HomepageBridge",
         "server/test_homepage_import.py::HomepageNormal.test_actions_only_by_hand",
         "server/test_homepage_import.py::HomepageMinecraft"]
docs = ["docs/SERVER-SETUP.md#import-from-homepage", "docs/REFERENCE_SERVER.md#config-keys"]
not_needed = { device_tests = "server side; the app sees ordinary Companion data" }
depends_on = ["server-sources", "source-uptime-kuma", "source-gatus", "source-proxmox", "source-pihole",
              "source-adguard", "source-sonarr", "source-radarr", "source-qbittorrent", "source-gameserver", "pyyaml"]
notes = "docs/plans/MODULAR.md M1.8. A config pre-processor, not a source type (docs/BRIDGE.md#how-it-runs). PyYAML only in the Docker image (owner decision 3); the YAML tests skip without it. New sources that Homepage has a widget for add a translator to WIDGETS in server/sources/_homepage.py."

