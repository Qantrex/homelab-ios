[[feature]]
id = "bridge-docker"
name = "Homelab Bridge in Docker (image, compose with a Tailscale sidecar)"
area = "Server"
status = "partial"
since = "2026-11-07"
summary = "`docker compose up` in server/ runs the Homelab Bridge next to a Tailscale sidecar that is its own tailnet machine: the bridge listens on 127.0.0.1 in the namespace it shares only with the sidecar, `tailscale serve` (HTTPS, login header, never Funnel) is the only way in, keys come from env files, both have a healthcheck. The image (ghcr.io/qantrex/homelab-bridge, non-root, read-only, PyYAML only here) is built and pushed by hand with scripts/build-bridge-image; CI builds and tests it and never pushes."
server_features = ["status", "hosts"]
endpoints = ["GET /info", "GET /state"]
sources = ["server/Dockerfile", "server/.dockerignore", "server/requirements-image.txt", "server/compose.yaml",
           "server/docker/serve.json", "server/docker/config.example.json", "server/docker/bridge.env.example",
           "server/docker/tailscale.env.example", "scripts/build-bridge-image"]
docs = ["docs/SERVER-SETUP.md#docker", "docs/GETTING-STARTED.md#b-homelab-bridge", "docs/RELEASE.md#homelab-bridge-image", "docs/CI.md#workflows"]
tests = ["server/test_reference_server.py::TailscaleModeTest"]
not_needed = { device_tests = "server side; the app sees an ordinary Companion server" }
depends_on = ["server-sources", "reference-server", "bridge-base-image", "pyyaml", "tailscale-image", "docker-socket-proxy", "docker", "tailscale", "gha-checkout", "gha-runners"]
notes = "docs/plans/MODULAR.md M1.7. Tested locally 2026-11-07 without a tailnet: the compose stack with an idle stand-in for the sidecar (identity header 200/403/401 from the shared namespace, nothing reachable from the host, healthy). Not tested yet: the real sidecar with an auth key, `tailscale serve` from serve.json, a buildx push to GHCR. scripts/build-bridge-image --test (CI job bridge-image) runs the server tests inside the image, then the image in token mode on loopback against check-live-api and its own healthcheck. Security review 2026-11-07: the image refuses TS_USERSPACE=true with a Tailscale login header (HOMELAB_ALLOW_USERSPACE=1 overrides) and warns without tailscale0; the socket proxy is wollomatic/socket-proxy with GET /containers/json only (tecnativa's CONTAINERS=1 also served container env, logs and files); the bridge image tag defaults to local, never latest."
unsure = "That tailscaled in userspace mode would hand tailnet connections to 127.0.0.1 ports (why compose.yaml uses kernel networking) is from Tailscale's netstack behaviour, not tested here."

