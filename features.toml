# Feature registry of the Homelab iOS app: every feature, where it lives, how it is tested, what it needs, where it
# is documented, and every dependency with its pinned version. One source of truth for the owner and for agents.
#
#   scripts/features            check it against the repo (part of scripts/lint, so CI runs it too)
#   scripts/features render     write docs/FEATURES.md from it (check fails while FEATURES.md is out of date)
#   scripts/features show X     which feature is X (an id, a file, a DeviceTest row, a test suite, a server feature)
#   scripts/features gaps       shipped features without tests, a phone row or docs
#   scripts/features json       everything as JSON (for the vault and other tools)
#
# Adding a feature = one [[feature]] entry. Fields (lists may be empty or left out):
#   id              lower-kebab, unique, never reused
#   name, area      area is one of the AREAS in scripts/features (Today, Cards, Actions, ...)
#   status          shipped | partial (works, but something is missing or unverified) | planned | removed
#   since           YYYY-MM-DD of the first commit with it (all are in 1.0.0, not released yet)
#   summary         one or two sentences, what the user gets
#   server_features `features` in GET /api/v1/info it needs (cases of ServerInfo.Feature); [] = any server
#   endpoints       "GET /state" ... as in server/openapi.yaml (without /api/v1)
#   api_fields      fields it reads (free text, not checked)
#   sources         files; "path#Symbol" also checks that Symbol is in that file
#   fixtures        Sources/HomelabKit/Fixtures/... it is demoed and tested with
#   tests           Swift Testing "Suite" or "Suite/function"; Python "file.py::Class[.method]"
#   device_tests    row ids of DeviceTest.md
#   screenshots     names of the CI shots in scripts/sim-smoke
#   docs            "file.md#anchor" (GitHub heading slugs)
#   launch_args, links, widgets, today_sections, card_styles: entries the code offers (checked against it)
#   settings        where the user switches it (free text)
#   depends_on      dependency ids below, or other feature ids
#   not_needed      {tests = "why"} / {device_tests = "why"} / {docs = "why"}: a gap on purpose
#   known_gaps      things found missing or out of date (listed under Gaps until fixed; delete the line then)
#   notes, unsure   free text; `unsure` marks what nobody verified yet (rendered as "(?)")

[shared]
# Files many features use, owned by none. Every file under Sources/, scripts/ and server/ must be claimed by a
# feature's `sources` (or `fixtures`) or be listed here.
sources = [
  "Sources/HomelabKit/AppModel.swift",
  "Sources/HomelabKit/Models.swift",
  "Sources/HomelabUI/AppModel.swift",
  "Sources/HomelabUI/Components.swift",
  "Sources/HomelabKit/Fixtures/info.json",
]

